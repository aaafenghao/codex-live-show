<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>codex-live-show</title><link rel="stylesheet" href="style.css"></head><body><div id="app-scroll"><main class="page">
<header class="heading"><h1>codex-live-show</h1><div class="controls"><button id="pin" aria-pressed="false" title="在桌面模式与始终置顶之间切换">置顶</button><button id="previewFireworks" title="立即试放完整烟花和彩花">试放烟花</button><button id="motion" aria-pressed="false">暂停动效</button><button id="scaleDown" aria-label="缩小挂件">−</button><button id="scaleUp" aria-label="放大挂件">＋</button><button id="reset">归位</button><button id="quit">退出</button></div></header>
<div class="scene" id="scene"><div class="widget" id="widget"><div class="staff" id="staff" title="拖动金箍棒移动挂件" role="button" tabindex="0" aria-label="移动挂件" aria-describedby="move-help"><div class="gold left"><svg viewBox="0 0 80 40"><path d="M10 6v28M70 6v28M18 12h13v8H20v8h17V12h17v16h12M44 20h10M18 8h46M18 32h46"/></svg></div><span class="band"></span><span class="staff-mark">箍</span><div class="gold right"><svg viewBox="0 0 80 40"><path d="M10 6v28M70 6v28M18 12h13v8H20v8h17V12h17v16h12M44 20h10M18 8h46M18 32h46"/></svg></div></div><p id="move-help" class="sr-only">方向键移动窗口，Shift加速，Home或Enter回到屏幕右上角。</p><div class="groups" id="groups"></div></div></div>
<div class="health"><span id="health" role="status">正在读取本机会话…</span><button id="unknownCount" hidden>待确认</button><button id="showHistory" aria-expanded="false" aria-controls="history">完成历史</button></div>
<section class="history" id="history" aria-labelledby="history-title" hidden><div class="history-head"><h2 id="history-title">会话记录</h2><button id="closeHistory">收起</button></div><label class="sr-only" for="historyState">记录范围</label><select id="historyState"><option value="ended">已结束</option><option value="unknown">待确认</option><option value="all">全部记录</option></select><input id="search" type="search" aria-label="搜索已完成会话" placeholder="搜索会话名称或工作空间"><p id="history-count" class="hint" role="status"></p><ul id="results"></ul></section>
</main></div><script src="completed-cards.js"></script><script src="renderer.js"></script></body></html>
